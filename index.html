<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>代号鸢抽卡记录本</title>
  <style>
    :root {
      --bg: #f5f2ec;
      --paper: #fffdfa;
      --card: #ffffff;
      --text: #29241f;
      --sub: #756b60;
      --line: #e7ddd0;
      --gold: #bd8737;
      --gold-soft: #faf0df;
      --accent: #724b28;
      --danger: #b42318;
      --success: #127a4a;
      --shadow: 0 12px 32px rgba(70, 51, 30, 0.07);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .page {
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px 18px 40px;
    }

    .hero {
      background: linear-gradient(135deg, #3d2b1e 0%, #68472b 58%, #9b6a35 100%);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 25px 28px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 32px;
      color: #fff;
    }

    .hero p {
      margin: 0;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.76);
      max-width: 920px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 10px 24px rgba(86, 60, 26, 0.04);
    }

    .stat-label {
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .stat-wide {
      grid-column: 1 / -1;
      min-height: 118px;
    }

    .collection-stat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .collection-missing {
      flex: 0 0 auto;
      padding: 12px 20px;
      border-radius: 999px;
      background: var(--gold-soft);
      color: var(--sub);
      font-size: 16px;
      font-weight: 700;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
    }

    .hero-badge {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff5e6;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .top-grid {
      display: grid;
      grid-template-columns: minmax(360px, 0.9fr) minmax(420px, 1.1fr);
      gap: 18px;
      align-items: start;
      margin-bottom: 18px;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 10px 24px rgba(86, 60, 26, 0.04);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-head .section-title {
      margin: 0;
    }

    .manager-panel {
      margin-bottom: 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 10px 24px rgba(86, 60, 26, 0.04);
      overflow: hidden;
    }

    .manager-panel summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 20px;
      cursor: pointer;
      color: var(--accent);
      font-weight: 700;
      list-style: none;
      user-select: none;
    }

    .manager-panel summary::-webkit-details-marker {
      display: none;
    }

    .manager-panel summary::after {
      content: "展开";
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--gold-soft);
      color: #9b6a1d;
      font-size: 12px;
    }

    .manager-panel[open] summary::after {
      content: "收起";
    }

    .manager-body {
      padding: 0 20px 20px;
      border-top: 1px solid var(--line);
    }

    .manager-grid {
      display: grid;
      grid-template-columns: minmax(300px, 0.8fr) minmax(0, 1.2fr);
      gap: 18px;
      padding-top: 18px;
      align-items: start;
    }

    .manager-form {
      padding: 18px;
      border-radius: 18px;
      background: #fffaf2;
      border: 1px solid var(--line);
    }

    .manager-list {
      max-height: 480px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
    }

    .manager-list table {
      border: 0;
      border-radius: 0;
    }

    .manager-list th {
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .section-note {
      color: var(--sub);
      font-size: 13px;
      line-height: 1.7;
      margin: -8px 0 14px;
    }

    .section-title {
      margin: 0 0 16px;
      font-size: 20px;
      line-height: 1.35;
      color: var(--accent);
      font-weight: 700;
    }

    .panel-title {
      font-size: 20px;
      line-height: 1.35;
      color: var(--accent);
      font-weight: 700;
    }

    .sub-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .mini-stat {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 20px;
    }

    .mini-stat h3 {
      margin: 0 0 12px;
      font-size: 20px;
      line-height: 1.35;
      color: var(--accent);
      font-weight: 700;
    }

    .mini-stat-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px dashed #eedfca;
      font-size: 14px;
    }

    .mini-stat-row:last-child {
      border-bottom: 0;
    }

    form {
      display: grid;
      gap: 12px;
      min-width: 0;
    }

    .field {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field label {
      font-size: 14px;
      color: var(--sub);
      font-weight: 600;
    }

    input,
    select,
    textarea,
    button {
      font: inherit;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      border: 1px solid #dcc7a8;
      border-radius: 11px;
      padding: 11px 13px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: 0.2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #c58e34;
      box-shadow: 0 0 0 4px rgba(214, 164, 76, 0.16);
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    input[type="date"] {
      display: block;
      -webkit-appearance: none;
      appearance: none;
      inline-size: 100%;
      min-inline-size: 0;
      max-inline-size: 100%;
      height: 46px;
      min-height: 46px;
      line-height: 24px;
      text-align: left;
      box-sizing: border-box;
      background-color: #fff;
    }

    input[type="date"]::-webkit-date-and-time-value {
      min-height: 24px;
      text-align: left;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      margin: 0;
    }

    .button-row,
    .toolbar,
    .toolbar-left,
    .toolbar-right {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary {
      background: #7b542f;
      color: #fff;
    }

    .secondary {
      background: #f4eee2;
      color: var(--text);
    }

    .ghost {
      background: var(--gold-soft);
      color: #9b6a1d;
    }

    .danger {
      background: #fff0ef;
      color: var(--danger);
    }

    .toolbar {
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .toolbar input,
    .toolbar select {
      min-width: 180px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--gold-soft);
      color: #9c6b20;
    }

    .tag-standard {
      background: #f1f5f9;
      color: #475569;
    }

    .tag-limited {
      background: #fff2da;
      color: #9b6a1d;
    }

    .tag-rerun {
      background: #fce8dc;
      color: #a34f2b;
    }

    .tag-select {
      background: #f5e8f7;
      color: #8a4d91;
    }

    .tag-success {
      background: #e9f8f1;
      color: var(--success);
    }

    .tag-warning {
      background: #fff4e5;
      color: #b26b0e;
    }

    .tag-danger {
      background: #fff1f1;
      color: var(--danger);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: #fff;
    }

    th,
    td {
      padding: 13px 12px;
      text-align: left;
      border-bottom: 1px solid #efe3d1;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #fbf4e7;
      color: var(--sub);
      font-weight: 700;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .empty {
      padding: 38px 18px;
      text-align: center;
      border: 1px dashed #dfcdb3;
      border-radius: 16px;
      color: var(--sub);
      background: #fcfaf6;
    }

    .empty strong {
      display: block;
      margin-bottom: 7px;
      color: var(--text);
      font-size: 16px;
    }

    .tips {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 16px;
      background: #fff8ea;
      border: 1px solid var(--line);
      color: #735f47;
      line-height: 1.8;
      font-size: 13px;
    }

    .pool-status {
      margin-top: 0;
      padding: 16px;
      background: #f8f3ea;
    }

    .pool-status-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }

    .pool-status-meta {
      color: var(--sub);
      font-size: 12px;
      line-height: 1.6;
    }

    .pity-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 12px 0 7px;
      font-size: 13px;
    }

    .progress {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #e8ddd0;
    }

    .progress-bar {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #bd8737, #7b542f);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: minmax(240px, 1.5fr) minmax(170px, 1fr) minmax(150px, 0.8fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .data-panel {
      margin-top: 16px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .data-panel summary {
      cursor: pointer;
      color: var(--sub);
      font-size: 13px;
      font-weight: 600;
    }

    .data-panel .button-row {
      margin-top: 12px;
    }

    .records-body {
      padding-top: 18px;
    }

    .pool-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .pool-card {
      border: 1px solid #ddc9ad;
      border-radius: 16px;
      background: #fffaf2;
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 16px rgba(86, 60, 26, 0.035);
    }

    .pool-card[open] {
      border-color: #cfa974;
      box-shadow: 0 10px 24px rgba(86, 60, 26, 0.08);
    }

    .pool-card > summary {
      padding: 16px;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }

    .pool-card > summary::-webkit-details-marker {
      display: none;
    }

    .pool-card > summary:hover {
      background: #fdf3e5;
    }

    .pool-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .pool-card-head > div:first-child {
      flex: 1 1 auto;
      min-width: 0;
    }

    .pool-card-head > .button-row {
      flex: 0 0 auto;
      flex-wrap: nowrap;
      gap: 6px;
    }

    .pool-card-head .tag {
      white-space: nowrap;
    }

    .pool-card h3 {
      margin: 0 0 4px;
      font-size: 16px;
    }

    .pool-card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .pool-metric {
      padding: 9px;
      border-radius: 10px;
      background: #f5eadc;
    }

    .pool-metric span {
      display: block;
      color: var(--sub);
      font-size: 11px;
      margin-bottom: 3px;
    }

    .pool-metric strong {
      font-size: 16px;
      color: var(--accent);
    }

    .expand-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 12px;
      color: var(--sub);
      font-size: 12px;
    }

    .expand-arrow {
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .pool-card[open] .expand-arrow {
      transform: rotate(180deg);
    }

    .pool-detail {
      padding: 14px 16px 16px;
      border-top: 1px solid var(--line);
      background: #faf1e5;
    }

    .pool-detail-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }

    .pull-list {
      display: grid;
      gap: 8px;
    }

    .pull-entry {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid #eee4d7;
      border-radius: 12px;
      background: #fff;
    }

    .pull-entry-index {
      display: grid;
      place-items: center;
      min-height: 42px;
      border-radius: 9px;
      background: var(--gold-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }

    .pull-entry-index.is-pity {
      background: #f1f5f9;
      color: #64748b;
    }

    .pull-entry-main {
      min-width: 0;
    }

    .pull-entry-name {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
      font-size: 14px;
      font-weight: 700;
    }

    .pull-entry-count {
      min-width: 52px;
      text-align: right;
      color: var(--accent);
      font-size: 22px;
      font-weight: 750;
    }

    .pull-entry-count span {
      margin-left: 3px;
      color: var(--sub);
      font-size: 11px;
      font-weight: 500;
    }

    .small {
      font-size: 12px;
      color: var(--sub);
      line-height: 1.7;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1080px) {
      .sub-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .top-grid {
        grid-template-columns: 1fr;
      }

      .manager-grid {
        grid-template-columns: 1fr;
      }

      .filter-grid {
        grid-template-columns: 1fr 1fr;
      }

      .filter-grid input {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 720px) {
      .page {
        padding: 16px;
      }

      .hero {
        padding: 20px;
      }

      .hero h1 {
        font-size: 26px;
      }

      .hero-top {
        display: block;
      }

      .hero-badge {
        display: inline-flex;
        margin-top: 14px;
      }

      .sub-grid,
      .field-row,
      .filter-grid {
        grid-template-columns: 1fr;
      }

      .stats {
        gap: 8px;
      }

      .stats .stat {
        min-width: 0;
        padding: 14px 10px;
      }

      .stats .stat-label {
        font-size: 12px;
      }

      .stats .stat-value {
        font-size: 24px;
      }

      #recordForm,
      #recordForm .field,
      #recordDate {
        inline-size: 100%;
        min-width: 0;
        max-inline-size: 100%;
        box-sizing: border-box;
      }

      #recordDate {
        display: block;
        height: 48px;
        min-height: 48px;
        padding: 11px 13px;
        font-size: 16px;
        line-height: 24px;
      }

      .pool-card-head {
        gap: 8px;
      }

      .pool-card-head > .button-row {
        gap: 4px;
      }

      .pool-card-head .tag {
        padding: 5px 8px;
        font-size: 11px;
      }

      .collection-stat {
        align-items: center;
        flex-direction: row;
        gap: 8px;
      }

      .collection-missing {
        margin-left: auto;
        padding: 10px 12px;
        font-size: 13px;
        white-space: nowrap;
      }

      .filter-grid input {
        grid-column: auto;
      }

      .pull-entry {
        grid-template-columns: 48px minmax(0, 1fr) auto;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .toolbar-left,
      .toolbar-right {
        width: 100%;
      }

      .toolbar input,
      .toolbar select {
        min-width: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <div class="hero-top">
        <div>
          <h1>代号鸢抽卡记录本</h1>
          <p>
            独立记录《代号鸢》卡池招募情况。选择卡池、填写抽数和抽到的密探，其余结果自动计算。
          </p>
        </div>
        <div class="hero-badge">代号鸢专属 · 40 抽保底 · 歪后必 UP</div>
      </div>
    </section>

    <section class="stats" id="overallStats"></section>

    <div class="top-grid">
      <aside class="card">
        <div class="section-head">
          <h2 class="section-title">记录一次招募</h2>
          <span class="tag">仅填 3 项</span>
        </div>
        <form id="recordForm">
          <input type="hidden" id="recordId" />

          <div class="field">
            <label for="recordDate">记录日期</label>
            <input id="recordDate" type="date" required />
          </div>

          <div class="field">
            <label for="poolSelect">选择卡池</label>
            <select id="poolSelect" required></select>
          </div>

          <div class="tips pool-status" id="selectedPoolInfo">
            选择卡池后显示开放时间和当期 UP。
          </div>

          <div class="field-row">
            <div class="field">
              <label for="pullCount">本次抽数</label>
              <input id="pullCount" type="number" min="1" step="1" placeholder="例如：30" required />
            </div>
            <div class="field">
              <label for="resultDisplay">自动判断结果</label>
              <input id="resultDisplay" type="text" value="未出绝密" readonly />
            </div>
          </div>

          <div class="field">
            <label for="characterName">本次出的密探</label>
            <select id="characterName">
              <option value="">未出绝密 / 仅累计抽数</option>
            </select>
          </div>

          <input id="notes" type="hidden" />

          <div class="button-row">
            <button type="submit" class="primary" id="submitButton">保存记录</button>
            <button type="button" class="secondary" id="resetButton">清空表单</button>
          </div>
        </form>

      </aside>

      <div class="sub-grid">
        <section class="mini-stat" id="standardStat"></section>
        <section class="mini-stat" id="limitedStat"></section>
      </div>
    </div>

    <details class="manager-panel" id="poolManagerPanel">
      <summary>
        <span class="panel-title">卡池管理</span>
        <span class="small">新增或修改卡池与当期 UP</span>
      </summary>
      <div class="manager-body">
        <div class="manager-grid">
          <form class="manager-form" id="poolForm">
            <input type="hidden" id="editingPoolId" />
            <h2 class="section-title" id="poolFormTitle">新增限定卡池</h2>
            <p class="section-note">填写后会立即出现在抽卡录入和筛选下拉框中。</p>
            <div class="field">
              <label for="managedPoolName">卡池名称</label>
              <input id="managedPoolName" type="text" placeholder="例如：新池名称" required />
            </div>

      const today = new Date();
      const offset = today.getTimezoneOffset() * 60000;
      return new Date(today.getTime() - offset).toISOString().slice(0, 10);
    }

    function getPoolById(poolId) {
      return POOL_CATALOG.find((pool) => pool.id === poolId) || null;
    }

      if (item.poolId) {

        if (matchedById) return matchedById;

        POOL_CATALOG.find((pool) => pool.name === item.poolName) ||

      return resultType === "up" || resultType === "up1" || resultType === "up2";

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatPercent(value) {
      if (!Number.isFinite(value)) return "0%";
      return `${(value * 100).toFixed(1)}%`;
    }

    function formatAverage(totalPulls, totalGold) {
      if (!totalGold) return "-";
      return (totalPulls / totalGold).toFixed(1);
    }

    function normalizePool(pool) {
      return {
        id: String(pool.id || `pool-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`),
        type: pool.type === "standard" ? "standard" : "limited",
        name: String(pool.name || "未命名卡池").trim(),
        start: String(pool.start || ""),
        end: String(pool.end || ""),
        ups: Array.isArray(pool.ups) ? pool.ups.map((name) => String(name).trim()).filter(Boolean) : [],
        selfSelect: Boolean(pool.selfSelect),
        selfSelectUntilId: String(pool.selfSelectUntilId || ""),
        selfSelectLabel: String(pool.selfSelectLabel || ""),
        isRerun: Boolean(pool.isRerun),
      };
    }

    function getPoolUpCharacters(pool) {
      return pool?.selfSelect ? ["自选密探"] : [...(pool?.ups || [])];
    }

    function getPoolUpLabel(pool) {
      return getPoolUpCharacters(pool).join("、") || "-";
    }

      if (pool?.type === "standard") return "普池";
      if (pool?.selfSelect) return "自选池";
      if (pool?.isRerun) return "限定复刻";
      return "限定池";
    }

    function getPoolCategoryClass(pool) {
      if (pool?.type === "standard") return "tag-standard";
      if (pool?.selfSelect) return "tag-select";
      if (pool?.isRerun) return "tag-rerun";
      return "tag-limited";
    }

    }

    function getSelfSelectCharacters(pool) {
      if (!pool?.selfSelectUntilId) return getAllAvailableCharacters();

    function mergeScheduleUpdate(catalog) {
      const requiredPools = [
        ...SCHEDULE_POOL_UPDATES,
        ...DEFAULT_POOL_CATALOG.filter((pool) => pool.start >= "2026-03-30"),
      ];
      const requiredById = new Map(requiredPools.map((pool) => [pool.id, normalizePool(pool)]));
      const merged = catalog.map((pool) => requiredById.get(pool.id) || pool);
      const existingIds = new Set(merged.map((pool) => pool.id));
      requiredById.forEach((pool, id) => {
        if (!existingIds.has(id)) merged.push(pool);
      });
      return merged;
    }

    function loadPoolCatalog() {
      try {
        const raw = localStorage.getItem(POOL_STORAGE_KEY);
        if (!raw) {
          localStorage.setItem(POOL_CATALOG_VERSION_KEY, POOL_CATALOG_VERSION);
          return DEFAULT_POOL_CATALOG.map(normalizePool);
        }
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed) || !parsed.length) throw new Error("卡池数据为空");
        let normalized = parsed.map(normalizePool);
        if (!normalized.some((pool) => pool.id === "standard")) {
          normalized.unshift(normalizePool(DEFAULT_POOL_CATALOG[0]));
        }
        if (localStorage.getItem(POOL_CATALOG_VERSION_KEY) !== POOL_CATALOG_VERSION) {
          normalized = mergeScheduleUpdate(normalized);
          localStorage.setItem(POOL_STORAGE_KEY, JSON.stringify(normalized));
          localStorage.setItem(POOL_CATALOG_VERSION_KEY, POOL_CATALOG_VERSION);
        }
        return normalized;
      } catch (error) {
        console.error("读取卡池失败", error);
        localStorage.setItem(POOL_CATALOG_VERSION_KEY, POOL_CATALOG_VERSION);
        return DEFAULT_POOL_CATALOG.map(normalizePool);
      }
    }

    function savePoolCatalog() {
      localStorage.setItem(POOL_STORAGE_KEY, JSON.stringify(POOL_CATALOG));
    }

    function loadRecords() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        const data = Array.isArray(parsed) ? parsed : parsed.records;
        if (!Array.isArray(data)) return [];
        return data.map(normalizeRecord);
      } catch (error) {
        console.error("读取记录失败", error);
        return [];
      }
    }

    function normalizeRecord(item) {
      const matchedPool = findPoolForLegacyRecord(item);
      const inferredPoolType = matchedPool?.type || item.poolType || (item.poolName === "绣衣天下" ? "standard" : "limited");
      const characterName = item.characterName || "";
      let resultType = item.resultType || "none";

      if (["limited", "up1", "up2"].includes(resultType)) resultType = "up";
      if (resultType === "offbanner") resultType = "nonup";

      if (inferredPoolType === "standard" && !["none", "standard-ssr"].includes(resultType)) {
        resultType = resultType === "none" ? "none" : "standard-ssr";
      }

      if (inferredPoolType === "limited" && !["none", "up", "nonup"].includes(resultType)) {
        resultType = "none";
      }


      return {
        id: item.id || crypto.randomUUID(),
        date: item.date || todayString(),
        poolId: matchedPool?.id || item.poolId || "",
        poolType: inferredPoolType,
        poolName: matchedPool?.name || item.poolName || "未命名卡池",
        upCharacters: matchedPool ? getPoolUpCharacters(matchedPool) : item.upCharacters || [item.upOne, item.upTwo].filter(Boolean),
        pullCount: Number(item.pullCount || 0),
        resultType,
        characterName,
        notes: item.notes || "",
        createdAt: item.createdAt || new Date().toISOString(),
        updatedAt: item.updatedAt || new Date().toISOString(),
      };
    }

    function saveRecords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function getPoolsNewestFirst() {
      return [...POOL_CATALOG].sort((a, b) => {
        if (a.type !== b.type) return a.type === "standard" ? 1 : -1;
        return (b.start || "").localeCompare(a.start || "");
      });
    }

    function getPoolsForSelector() {
      return [...POOL_CATALOG].sort((a, b) => {
        if (a.type !== b.type) return a.type === "standard" ? 1 : -1;
        return (a.start || "").localeCompare(b.start || "");
      });
    }

      const selectableCharacters = selectedPool?.selfSelect

        : allCharacters;
      const currentUps =

    function determineResultType(pool, characterName) {
      if (!characterName) return "none";
      if (pool.type === "standard") return "standard-ssr";
      if (pool.selfSelect) return "up";
      return pool.ups.includes(characterName) ? "up" : "nonup";

    function updateAutomaticResult() {

    function resultLabel(record) {
      if (record.poolType === "standard") {
        return record.resultType === "standard-ssr"
          ? '<span class="tag tag-success">普池出绝密</span>'
          : '<span class="tag tag-standard">未出绝密</span>';
      }

      if (isLimitedUp(record.resultType)) {
        return `<span class="tag tag-success">命中 UP${record.characterName ? ` · ${escapeHtml(record.characterName)}` : ""}</span>`;
      }
      if (record.resultType === "nonup") {
        return '<span class="tag tag-warning">歪了 / 非 UP</span>';
      }
      return '<span class="tag tag-standard">未出绝密</span>';
    }

    function summarize(data) {
      const totalPulls = data.reduce((sum, item) => sum + item.pullCount, 0);
      const totalGold = data.filter((item) => isGold(item.resultType)).length;
      const limitedData = data.filter((item) => item.poolType === "limited");
      const standardData = data.filter((item) => item.poolType === "standard");
      const limitedGold = limitedData.filter((item) => isGold(item.resultType)).length;
      const limitedUpGold = limitedData.filter((item) => isLimitedUp(item.resultType)).length;
      const standardGold = standardData.filter((item) => isGold(item.resultType)).length;

      const characterCountMap = new Map();
      data.forEach((item) => {
        if (!item.characterName || !isGold(item.resultType)) return;
        characterCountMap.set(item.characterName, (characterCountMap.get(item.characterName) || 0) + 1);
      });

      const mostCommonCharacter = Array.from(characterCountMap.entries()).sort((a, b) => b[1] - a[1])[0] || null;

      const limitedUpOnlyMap = new Map();
      limitedData
        .filter((item) => isLimitedUp(item.resultType) && item.characterName)
        .forEach((item) => {
          limitedUpOnlyMap.set(item.characterName, (limitedUpOnlyMap.get(item.characterName) || 0) + 1);
        });

      const mostCommonLimitedUp = Array.from(limitedUpOnlyMap.entries()).sort((a, b) => b[1] - a[1])[0] || null;

      const limitedPoolOutcomes = getPoolSummary(data).filter((item) => item.poolType === "limited");
      const smallPityAttempts = limitedPoolOutcomes.reduce((sum, item) => sum + item.smallPityAttempts, 0);
      const directUpWins = limitedPoolOutcomes.reduce((sum, item) => sum + item.directUpWins, 0);

      return {
        totalPulls,
        totalGold,
        avgGoldPulls: formatAverage(totalPulls, totalGold),
        limitedPulls: limitedData.reduce((sum, item) => sum + item.pullCount, 0),
        limitedGold,
        limitedUpGold,
        limitedNoOffRate: smallPityAttempts ? directUpWins / smallPityAttempts : 0,
        limitedAvgGoldPulls: formatAverage(
          limitedData.reduce((sum, item) => sum + item.pullCount, 0),
          limitedGold
        ),
        standardPulls: standardData.reduce((sum, item) => sum + item.pullCount, 0),
        standardGold,
        standardAvgGoldPulls: formatAverage(
          standardData.reduce((sum, item) => sum + item.pullCount, 0),
          standardGold
        ),
        totalPools: new Set(data.map((item) => `${item.poolType}:${item.poolName}`)).size,
        mostCommonCharacter,
        mostCommonLimitedUp,
      };
    }

    function getPoolSummary(data) {
      const sorted = [...data].sort((a, b) => {
        if (a.date === b.date) {
          return new Date(a.createdAt).getTime() - new Date(b.createdAt).getTime();
        }
        return a.date > b.date ? 1 : -1;
      });

      const map = new Map(
        POOL_CATALOG.map((pool) => [
          pool.id,
          {
            key: pool.id,
            poolId: pool.id,
            poolType: pool.type,
            poolName: pool.name,
            upCharacters: getPoolUpCharacters(pool),
            selfSelect: pool.selfSelect,
            isRerun: pool.isRerun,
            start: pool.start,
            end: pool.end,
            totalPulls: 0,
            totalGold: 0,
            upGold: 0,
            latestDate: "",
            pityProgress: 0,
            guaranteedUp: false,
            smallPityAttempts: 0,
            directUpWins: 0,
            records: 0,
          },
        ])
      );

      sorted.forEach((item) => {
        const key = item.poolId || `${item.poolType}::${item.poolName}`;
        if (!map.has(key)) {
          map.set(key, {
            key,
            poolId: item.poolId || "",
            poolType: item.poolType,
            poolName: item.poolName,
            upCharacters: item.upCharacters || [],
            selfSelect: false,
            isRerun: false,
            start: "",
            end: "",
            totalPulls: 0,
            totalGold: 0,
            upGold: 0,
            latestDate: "",
            pityProgress: 0,
            guaranteedUp: false,
            smallPityAttempts: 0,
            directUpWins: 0,
            records: 0,
          });
        }

        const current = map.get(key);
        current.totalPulls += item.pullCount;
        current.records += 1;
        current.latestDate = item.date > current.latestDate ? item.date : current.latestDate;

        if (isGold(item.resultType)) {
          current.totalGold += 1;
          if (isLimitedUp(item.resultType)) {
            current.upGold += 1;
            if (current.poolType === "limited" && !current.guaranteedUp) {
              current.smallPityAttempts += 1;
              current.directUpWins += 1;
            }
          } else if (item.resultType === "nonup" && current.poolType === "limited") {
            if (!current.guaranteedUp) current.smallPityAttempts += 1;
          }
          current.pityProgress = 0;
          if (current.poolType === "limited") {
            current.guaranteedUp = item.resultType === "nonup";
          }
        } else {
          current.pityProgress += item.pullCount;
        }
      });

      return Array.from(map.values())
        .map((item) => ({
          ...item,
          avgGoldPulls: formatAverage(item.totalPulls, item.totalGold),
          upRate: item.smallPityAttempts ? item.directUpWins / item.smallPityAttempts : 0,
          toNextPity: Math.max(0, 40 - item.pityProgress),
        }))
        .sort((a, b) => {
          if (a.poolType !== b.poolType) return a.poolType === "standard" ? 1 : -1;
          return (b.start || "").localeCompare(a.start || "");
        });
    }

                        <div class="small">${
                          item.poolType === "limited"
                            ? `${item.start || "-"} 至 ${item.end || "-"}`
                            : "常驻普池"
                        }</div>
                      </div>
                      <div class="button-row">${category}${status}</div>
                    </div>
                    ${
                      item.poolType === "limited"
                        ? `<div class="small">UP：${escapeHtml(item.upCharacters.join("、") || "-")}</div>`
                        : ""
                    }
                    <div class="pool-card-grid">
                      <div class="pool-metric"><span>累计抽数</span><strong>${item.totalPulls}</strong></div>
                      <div class="pool-metric"><span>绝密 / UP</span><strong>${item.totalGold}${item.poolType === "limited" ? ` / ${item.upGold}` : ""}</strong></div>
                      <div class="pool-metric"><span>${item.poolType === "limited" ? "小保底不歪" : "平均出金"}</span><strong>${item.poolType === "limited" ? formatPercent(item.upRate) : item.avgGoldPulls}</strong></div>
                    </div>
                    <div class="pity-line">
                      <span>已垫 <strong>${item.pityProgress}</strong> 抽</span>
                      <span>距保底 <strong>${item.toNextPity}</strong> 抽</span>
                    </div>
                    <div class="progress"><div class="progress-bar" style="width:${progressPercent}%"></div></div>
                    <div class="expand-hint">
                      ${detailRecords.length ? `查看 ${detailRecords.length} 条抽取明细` : "暂无记录"}
                      <span class="expand-arrow">⌄</span>
                    </div>
                  </summary>
                  <div class="pool-detail">
                    <div class="pool-detail-title">
                      <span>抽取明细</span>
                      <span class="small">${detailRecords.length} 条记录</span>
                    </div>
                    ${renderPoolRecordDetails(item)}
                  </div>
                </details>
              `;
            })
            .join("")}
        </div>
      `;
    }

    function getFilteredRecords() {
      const keyword = searchInput.value.trim().toLowerCase();
      const selectedPool = poolFilter.value.trim();
      const selectedType = typeFilter.value.trim();

      return [...records]
        .filter((item) => {
          const matchesPool = !selectedPool || item.poolName.trim() === selectedPool;
          const itemPool = getPoolById(item.poolId);
          const matchesType =
            !selectedType ||
            (selectedType === "standard" && item.poolType === "standard") ||
            (selectedType === "limited" && item.poolType === "limited" && !itemPool?.isRerun && !itemPool?.selfSelect) ||
            (selectedType === "rerun" && itemPool?.isRerun) ||
            (selectedType === "selfSelect" && itemPool?.selfSelect);
          const target = `${item.poolName} ${item.characterName} ${(item.upCharacters || []).join(" ")}`.toLowerCase();
          const matchesKeyword = !keyword || target.includes(keyword);
          return matchesPool && matchesType && matchesKeyword;
        })
        .sort((a, b) => {
          if (a.date === b.date) {
            return new Date(b.updatedAt || b.createdAt).getTime() - new Date(a.updatedAt || a.createdAt).getTime();
          }
          return a.date < b.date ? 1 : -1;
        });
    }

    function renderRecordList() {
      const filtered = getFilteredRecords();
      recordCountText.textContent =
        filtered.length === records.length ? `${records.length} 条记录` : `${filtered.length} / ${records.length} 条记录`;
      if (!filtered.length) {
        recordListContainer.innerHTML = `
          <div class="empty">
            <strong>${records.length ? "没有符合筛选条件的记录" : "还没有招募记录"}</strong>
            ${records.length ? "换一个卡池或清除搜索词试试。" : "在上方选择卡池并保存一次招募，明细会显示在这里。"}
          </div>
        `;
        return;
      }

      recordListContainer.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>日期</th>
                <th>卡池</th>
                <th>抽数</th>
                <th>结果</th>
                <th>本次出的密探</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              ${filtered
                .map((item) => {
                  const itemPool = getPoolById(item.poolId) || {
                    type: item.poolType,
                    selfSelect: false,
                    isRerun: false,
                  };
                  return `
                    <tr>
                      <td>${item.date}</td>
                      <td>
                        <span class="tag ${getPoolCategoryClass(itemPool)}">${getPoolCategoryLabel(itemPool)}</span>
                        <div style="margin-top:6px;"><strong>${escapeHtml(item.poolName)}</strong></div>
                        ${
                          item.poolType === "limited"
                            ? `<div class="small">UP：${escapeHtml((item.upCharacters || []).join("、") || "-")}</div>`
                            : ""
                        }
                      </td>
                      <td>${item.pullCount}</td>
                      <td>${resultLabel(item)}</td>
                      <td>${item.characterName ? escapeHtml(item.characterName) : '<span class="small">未填写</span>'}</td>
                      <td>
                        <div class="button-row">
                          <button type="button" class="ghost" onclick="editRecord('${item.id}')">编辑</button>
                          <button type="button" class="danger" onclick="deleteRecord('${item.id}')">删除</button>
                        </div>
                      </td>
                    </tr>
                  `;
                })
                .join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function getPreferredPoolId() {
      const rememberedPoolId = localStorage.getItem(LAST_SELECTED_POOL_KEY);
      if (rememberedPoolId && getPoolById(rememberedPoolId)) return rememberedPoolId;
      const latestRecord = [...records]
        .filter((item) => getPoolById(item.poolId))
        .sort(
          (a, b) =>
            new Date(b.updatedAt || b.createdAt).getTime() -
            new Date(a.updatedAt || a.createdAt).getTime()
        )[0];
      return latestRecord?.poolId || "standard";
    }

    function resetForm() {
      recordIdInput.value = "";
      recordDateInput.value = todayString();
      poolSelect.value = getPreferredPoolId();
      pullCountInput.value = "";
      populateCharacterOptions("");
      notesInput.value = "";
      syncSelectedPoolUI();
      submitButton.textContent = "保存记录";
    }

    function rerender() {
      saveRecords();
      renderOverallStats();
      renderMiniStats();
      updatePoolFilterOptions();
      renderPoolSummary();
      renderRecordList();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const pool = getPoolById(poolSelect.value) || POOL_CATALOG[0];
      const characterName = characterNameInput.value.trim();
      const payload = {
        id: recordIdInput.value || crypto.randomUUID(),
        date: recordDateInput.value,
        poolId: pool.id,
        poolType: pool.type,
        poolName: pool.name,
        upCharacters: getPoolUpCharacters(pool),
        pullCount: Number(pullCountInput.value),
        resultType: determineResultType(pool, characterName),
        characterName,
        notes: notesInput.value.trim(),
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      };

      if (!payload.pullCount || payload.pullCount < 1) {
        alert("本次抽数需要是大于 0 的数字。");
        return;
      }

      const existingIndex = records.findIndex((item) => item.id === payload.id);
      if (existingIndex >= 0) {
        payload.createdAt = records[existingIndex].createdAt || payload.createdAt;
        records[existingIndex] = payload;
      } else {
        records.push(payload);
      }

      localStorage.setItem(LAST_SELECTED_POOL_KEY, pool.id);
      rerender();
      resetForm();
    });

    poolSelect.addEventListener("change", () => {
      populateCharacterOptions("");
      syncSelectedPoolUI();
    });
    characterNameInput.addEventListener("change", updateAutomaticResult);
    resetButton.addEventListener("click", resetForm);
    searchInput.addEventListener("input", renderRecordList);
    poolFilter.addEventListener("change", renderRecordList);
    typeFilter.addEventListener("change", renderRecordList);
    toggleAllPoolsButton.addEventListener("click", () => {
      showAllPools = !showAllPools;
      renderPoolSummary();
    });

    exportButton.addEventListener("click", () => {
      const data = {
        exportedAt: new Date().toISOString(),
        rules: {
          standardPoolName: "绣衣天下",
          pity: 40,
          limitedDescription: "限定池通常双 UP，部分特殊池含三名 UP；两个保底内必出当期 UP 之一",
        },
        poolCatalog: POOL_CATALOG,
        records,
      };

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `代号鸢抽卡记录备份_${todayString()}.json`;
      link.click();
      URL.revokeObjectURL(url);
    });

    importButton.addEventListener("click", () => importFileInput.click());

    importFileInput.addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;

      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        const importedRecords = Array.isArray(parsed) ? parsed : parsed.records;
        if (!Array.isArray(importedRecords)) throw new Error("文件格式不正确");

        const shouldReplace = confirm("导入会覆盖当前浏览器里的记录，是否继续？");
        if (!shouldReplace) return;

        if (Array.isArray(parsed.poolCatalog) && parsed.poolCatalog.length) {
          POOL_CATALOG = mergeScheduleUpdate(parsed.poolCatalog.map(normalizePool));
          if (!POOL_CATALOG.some((pool) => pool.id === "standard")) {
            POOL_CATALOG.unshift(normalizePool(DEFAULT_POOL_CATALOG[0]));
          }
          localStorage.setItem(POOL_CATALOG_VERSION_KEY, POOL_CATALOG_VERSION);
          savePoolCatalog();
          populatePoolOptions();
          populateCharacterOptions();
          renderManagedPoolList();
        }
        records = importedRecords.map(normalizeRecord);
        rerender();
        resetForm();
        alert("导入成功。");
      } catch (error) {
        alert("导入失败，请确认文件是本工具导出的 JSON。");
      } finally {
        importFileInput.value = "";
      }
    });

    clearAllButton.addEventListener("click", () => {
      const confirmed = confirm("确认清空全部记录吗？此操作无法撤销。");
      if (!confirmed) return;
      records = [];
      rerender();
      resetForm();
    });

    poolForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const ups = parseUpCharacters(managedPoolUpsInput.value);
      const start = managedPoolStartInput.value;
      const end = managedPoolEndInput.value;
      const name = managedPoolNameInput.value.trim();

      if (!name || !start || !end || !ups.length) {
        alert("请完整填写卡池名称、时间和至少一名 UP 密探。");
        return;
      }
      if (end < start) {
        alert("结束日期不能早于开始日期。");
        return;
      }

      const editingId = editingPoolIdInput.value;
      if (editingId) {
        const index = POOL_CATALOG.findIndex((pool) => pool.id === editingId);
        if (index < 0) return;
        const updatedPool = { ...POOL_CATALOG[index], name, start, end, ups };
        POOL_CATALOG[index] = updatedPool;
        records = records.map((record) => {
          if (record.poolId !== editingId) return record;
          return {
            ...record,
            poolName: name,
            upCharacters: [...ups],
            resultType: determineResultType(updatedPool, record.characterName),
            updatedAt: new Date().toISOString(),
          };
        });
        saveRecords();
      } else {
        const id = `pool-${start}-${Date.now().toString(36)}`;
        POOL_CATALOG.push({ id, type: "limited", name, start, end, ups });
      }

      resetPoolForm();
      refreshPoolRelatedUI();
      renderOverallStats();
      renderMiniStats();
    });

    cancelPoolEditButton.addEventListener("click", resetPoolForm);

    window.editRecord = function editRecord(id) {
      const target = records.find((item) => item.id === id);
      if (!target) return;
      recordIdInput.value = target.id;
      recordDateInput.value = target.date;
      poolSelect.value = target.poolId || "standard";
      pullCountInput.value = target.pullCount;
      populateCharacterOptions(target.characterName || "");
      notesInput.value = target.notes || "";
      syncSelectedPoolUI();
      submitButton.textContent = "更新记录";
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    window.deleteRecord = function deleteRecord(id) {
      const confirmed = confirm("确认删除这条记录吗？");
      if (!confirmed) return;
      records = records.filter((item) => item.id !== id);
      rerender();
      if (recordIdInput.value === id) resetForm();
    };

    window.editPool = function editPool(id) {
      const pool = POOL_CATALOG.find((item) => item.id === id && item.type === "limited");
      if (!pool) return;
      editingPoolIdInput.value = pool.id;
      managedPoolNameInput.value = pool.name;
      managedPoolStartInput.value = pool.start;
      managedPoolEndInput.value = pool.end;
      managedPoolUpsInput.value = pool.selfSelect ? "自选密探" : pool.ups.join("、");
      poolFormTitle.textContent = "编辑限定卡池";
      savePoolButton.textContent = "保存修改";
      cancelPoolEditButton.classList.remove("hidden");
      poolManagerPanel.open = true;
      poolForm.scrollIntoView({ behavior: "smooth", block: "center" });
    };

    window.deletePool = function deletePool(id) {
      const pool = POOL_CATALOG.find((item) => item.id === id && item.type === "limited");
      if (!pool) return;
      const relatedCount = records.filter((record) => record.poolId === id).length;
      const detail = relatedCount
        ? `该卡池已有 ${relatedCount} 条抽卡记录。删除卡池不会删除历史记录，但之后无法再从下拉框选择它。`
        : "删除后将无法从下拉框选择该卡池。";
      if (!confirm(`确认删除“${pool.name}”吗？\n${detail}`)) return;
      POOL_CATALOG = POOL_CATALOG.filter((item) => item.id !== id);
      if (editingPoolIdInput.value === id) resetPoolForm();
      refreshPoolRelatedUI();
    };

    populatePoolOptions();
    populateCharacterOptions();
    renderManagedPoolList();
    resetPoolForm();
    resetForm();
    rerender();
  </script>
</body>
</html>
